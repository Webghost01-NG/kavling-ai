services:
  - type: web
    name: kavling-prototype
    runtime: python
    buildCommand: pip install -r agent/requirements.txt
    startCommand: uvicorn kavling.server:app --app-dir agent --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: AGENT_PRIVATE_KEY
        sync: false
      - key: REGISTRY_ADDRESS
        sync: false
      - key: CHAIN_ID
        value: "97"
      - key: RPC_URL
        value: https://bsc-testnet-dataseed.bnbchain.org
      - key: CORS_ORIGINS
        value: https://kavling-ai.vercel.app
