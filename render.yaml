services:
  - type: web
    name: kavling-prototype
    runtime: python
    buildCommand: pip install -r agent/requirements.txt
    startCommand: uvicorn kavling.server:app --app-dir agent --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: AGENT_PRIVATE_KEY
        sync: false
      - key: REGISTRY_ADDRESS
        sync: false
      - key: CHAIN_ID
        value: "97"
      - key: RPC_URL
        value: https://data-seed-prebsc-1-s1.binance.org:8545/
      - key: CORS_ORIGINS
        value: https://kavling-prototype.onrender.com
